.swipe-hint{font:11px ui-monospace,monospace;color:#855393;margin:3px 0 8px}.meter{height:100px;gap:4px;align-items:center}.meter span{width:56px;height:92px;flex:none;background:#a96783;filter:none}.meter .lit{background:#ff1744;filter:none}.availability{padding:14px 0 0}.paid-note{font-size:11px!important}.card-star{display:grid;place-items:center;width:78px;height:78px;font-size:58px;border-radius:24px;color:#fff5fc;border:2px solid #ffffffa0;background:linear-gradient(145deg,#ffffff38,#ffffff08);box-shadow:2px 4px 0 #1c082b50,inset 0 1px 0 #fff8;transform:rotate(12deg);text-shadow:none}.spark,.spark.blue{text-shadow:none}.front{box-shadow:0 10px 22px #5b26682b,inset 0 1px 0 #ffffff80}.rail{cursor:grab;touch-action:pan-x pan-y}.rail:active{cursor:grabbing}@media(max-width:380px){.meter{gap:3px}.meter span{width:50px;height:88px}}.meter span{--figure-ink:#a96783;background:none!important;mask:none!important;-webkit-mask:none!important}.meter span.lit{--figure-ink:#ff1744}.meter span::before{content:"";display:block;width:100%;height:100%;background:var(--figure-ink);mask:url('assets/Sailor%20Moon.png') center/contain no-repeat;-webkit-mask:url('assets/Sailor%20Moon.png') center/contain no-repeat}.hero h1{color:#33164e;text-shadow:none}.hero h1 span{color:#c02488;text-shadow:none}.meter{height:auto;min-height:194px;gap:12px 0;flex-wrap:wrap}.meter span{width:112px;height:184px}.availability{padding-top:20px}@media(max-width:380px){.meter{gap:12px 0}.meter span{width:100px;height:176px}}.hero h1.neon-headline{position:relative;isolation:isolate;width:min(100%,680px);margin:10px auto 20px;line-height:0}.neon-headline::before{content:"";position:absolute;inset:0;z-index:-1;background:url("assets/tonight-english-heavy-clean-v1.png") center/100% 100% no-repeat;filter:brightness(1.35) saturate(1.15) blur(5px);opacity:.28;pointer-events:none}.neon-headline::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(125deg,#fff4ff75 0%,#fff4ff30 22%,transparent 48%);-webkit-mask:url("assets/tonight-english-heavy-clean-v1.png") center/100% 100% no-repeat;mask:url("assets/tonight-english-heavy-clean-v1.png") center/100% 100% no-repeat;mix-blend-mode:screen;opacity:.42;pointer-events:none}.neon-headline img{display:block;width:100%;height:auto;filter:brightness(1.25) saturate(1.2) drop-shadow(-.35px -.45px .2px #fff1ff55) drop-shadow(.5px 1px .7px #31113e40)}.meter span::before{transition:background-color 650ms ease-in-out}.scene{transition:transform 220ms ease,filter 220ms ease}@media(hover:hover) and (pointer:fine){.scene:hover{transform:translateY(-5px);filter:drop-shadow(0 9px 9px #35174e26)}}@media(prefers-reduced-motion:reduce){.meter span::before,.scene{transition:none}.scene:hover{transform:none}}.glass-logo{position:relative;isolation:isolate;display:grid;place-items:center;width:164px;height:62px;margin:0 auto;border:1px solid #ffffffa6;border-radius:999px;background:linear-gradient(145deg,#ffffff6b,#ffffff15 52%,#d6efff26);backdrop-filter:blur(14px) saturate(1.12);-webkit-backdrop-filter:blur(14px) saturate(1.12);box-shadow:0 5px 14px #41265412,inset 0 1px 1px #ffffffe6,inset 0 -1px 2px #6c80b51a;overflow:hidden}.glass-logo img{display:block;width:142px;height:auto;position:relative;z-index:1;filter:drop-shadow(0 1px 1px #37224520)}.glass-logo::before{content:"";position:absolute;inset:1px;border-radius:inherit;padding:1px;background:conic-gradient(from 30deg,#ffffff10,#a3eaff65,#baadff50,#f8bddd55,#fff1b54d,#bdf1e340,#ffffff10);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}.glass-logo::after{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;background:radial-gradient(ellipse at 28% 0%,#ffffffa6,transparent 40%),linear-gradient(120deg,transparent 27%,#ffffff26 35%,transparent 45%);pointer-events:none}@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass-logo{background:linear-gradient(145deg,#ffffffe0,#f3eafa99)}}header{position:relative;z-index:5;will-change:transform}</style><link rel="stylesheet" href="guest-list.css?v=25"><header><a class="glass-logo" href="index.html?v=nightlights-home-v10" aria-label="Night Lights — home"><img src="assets/nightlights-26-chrome-transparent-v1.png" width="2172" height="724" alt="Night Lights"></a></header><main><section class="hero"><h1 class="neon-headline"><img src="assets/tonight-english-heavy-clean-v1.png" width="1118" height="582" alt="Tonight with Your friends"></h1><p>Pick a place. <mark class="friends-highlight">Bring your friends.</mark></p></section><section class="rail" id="rail" aria-label="Venue invitations"></section><section class="steps"><div class="ribbon">GOOD NIGHTS. GREAT PHOTOS.<br>TAG VENUES. ENJOY.</div><h2>Your night in three steps.</h2><div class="steps-grid"><p><strong>Pick a spot.</strong> Request the guest list.</p><p><strong>Scan in.</strong> No later than 45 minutes after start.</p><p><strong>Stay three hours.</strong> Scan your QR in and out.</p></div><p class="paid-note">Paid booking? Both scans are required for payment.</p></section></main><dialog id="booking"><div id="booking-content"></div><button class="close" id="close">Back to tonight</button></dialog>
<script>
const venues=[{id:'sugar',name:'Sugar',area:'Soi 11 · Hip-hop',base:'#232149',accent:'#b568c7',perk:'Entry + shared drinks',time:'22:00',spots:2,status:'Filling up',maps:'Sugar Club Bangkok Sukhumvit Soi 11'},{id:'mira',name:'MIRA',area:'Soi 11 · Nightclub',base:'#392044',accent:'#ef91bb',perk:'Entry + shared table',time:'22:30',spots:0,status:'Full · waitlist open',maps:'MIRA Club Bangkok Sukhumvit Soi 11'},{id:'tichuca',name:'Tichuca',area:'Sukhumvit 40 · Rooftop',base:'#152e57',accent:'#57cce6',perk:'A rooftop night + welcome drink',time:'23:00',spots:4,status:'Guest list open',maps:'Tichuca Rooftop Bar Bangkok'}];
function deadlineLabel(time){const [h,m]=time.split(':').map(Number),total=h*60+m+45;return String(Math.floor(total/60)%24).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}
const rail=document.getElementById('rail');
rail.innerHTML=venues.map(v=>`<article class="venue" id="${v.id}" style="--base:${v.base};--accent:${v.accent}"><div class="scene"><div class="inner"><button class="face front" aria-label="Show ${v.name} details"><span class="card-brand">nightlights.</span><span class="rings" aria-hidden="true"></span><div class="front-bottom"><div class="area">${v.area}</div><h2>${v.name.toUpperCase()}</h2><p class="perk">${v.perk}</p><div class="turn-hint">TAP TO TURN ↗</div></div></button><div class="face back" inert aria-hidden="true"><div class="eyebrow" style="color:#e4bfef">Your invitation</div><h2>${v.name}, tonight.</h2><p class="sub">You + your friends</p><div class="detail"><small>Included</small>${v.perk}</div><div class="detail"><small>Tonight’s plan</small>${v.time} start · stay three hours<br>Scan in by ${deadlineLabel(v.time)}</div><div class="detail"><small>Dress code / theme</small>To be confirmed</div><a class="maps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.maps)}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a><button class="back-join" type="button">Join guest list</button></div></div></div><div class="availability"><div class="meter" aria-hidden="true">${["#9DF1A3","#A0D7FA","#FDCFBC","#FC7276","#C8A0FA","#F9E58F"].map(ink=>`<span style="--figure-ink:${ink}" aria-hidden="true"></span>`).join('')}</div><button class="request" data-id="${v.id}">Join guest list</button></div></article>`).join('');
// Decorative figures share the same independent colour cycle as the guest row.
for(const article of rail.children){const figures=article.querySelector('.meter').cloneNode(true);figures.className='back-figures';article.querySelector('.back').prepend(figures)}
// Size the travelling card outline to the actual rounded glass perimeter.
for(const article of rail.children){
 const back=article.querySelector('.back');
 back.insertAdjacentHTML('beforeend',`<svg class="card-orbit" aria-hidden="true" focusable="false"><rect class="orbit-track"/><rect class="orbit-tail" pathLength="100"/><rect class="orbit-mid" pathLength="100"/><rect class="orbit-head" pathLength="100"/></svg>`);
 const svg=back.querySelector('.card-orbit');
 const sizeOutline=()=>{const w=back.clientWidth,h=back.clientHeight;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.querySelectorAll('rect').forEach(rect=>{rect.setAttribute('x','2');rect.setAttribute('y','2');rect.setAttribute('width',Math.max(0,w-4));rect.setAttribute('height',Math.max(0,h-4));rect.setAttribute('rx','24')})};
 new ResizeObserver(sizeOutline).observe(back);sizeOutline();
}
function flip(article,show){article.querySelector('.scene').classList.toggle('flipped',show);const front=article.querySelector('.front'),back=article.querySelector('.back');front.inert=show;back.inert=!show;front.setAttribute('aria-hidden',String(show));back.setAttribute('aria-hidden',String(!show));setTimeout(()=>{if(article.querySelector('.scene').classList.contains('flipped')===show)(show?article.querySelector('.back-join'):front).focus({preventScroll:true})},matchMedia('(prefers-reduced-motion:reduce)').matches?0:330)}
for(const article of rail.children){article.querySelector('.front').onclick=()=>flip(article,true);article.querySelector('.back').onclick=e=>{if(e.target.closest('a,button'))return;flip(article,false)};article.addEventListener('keydown',e=>{if(e.key==='Escape')flip(article,false)})}
let drag=null,suppressClick=false;rail.addEventListener('pointerdown',e=>{if(rail.scrollWidth<=rail.clientWidth||e.pointerType!=='mouse'||e.button!==0||e.target.closest('form,input,.social-switch,.request,a'))return;drag={x:e.clientX,left:rail.scrollLeft,moved:false,id:e.pointerId};suppressClick=false});rail.addEventListener('pointermove',e=>{if(!drag)return;const delta=e.clientX-drag.x;if(Math.abs(delta)>8&&!drag.moved){drag.moved=true;rail.setPointerCapture(e.pointerId);rail.style.scrollSnapType='none'}if(drag.moved){rail.scrollLeft=drag.left-delta;e.preventDefault()}});function stopDrag(){if(drag?.moved){suppressClick=true;rail.style.scrollSnapType='';}drag=null}rail.addEventListener('pointerup',stopDrag);rail.addEventListener('pointercancel',stopDrag);rail.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false}},true);
const dialog=document.getElementById('booking'),content=document.getElementById('booking-content');let timer;
document.getElementById('close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>clearInterval(timer));

// Independent, gently blended colour changes; repeats across figures are intentional.
const figurePalette=['#9DF1A3','#A0D7FA','#FDCFBC','#FC7276','#C8A0FA','#F9E58F'];
const figureMotion=matchMedia('(prefers-reduced-motion: reduce)');
const figureTimers=new Map();
function stopFigureColours(){for(const timer of figureTimers.values())clearTimeout(timer);figureTimers.clear()}
function scheduleFigureColour(figure){const delay=300+Math.random()*1700;figureTimers.set(figure,setTimeout(()=>{figure.style.setProperty('--figure-ink',figurePalette[Math.floor(Math.random()*figurePalette.length)]);scheduleFigureColour(figure)},delay))}
function startFigureColours(){stopFigureColours();if(document.hidden||figureMotion.matches)return;document.querySelectorAll('.meter span,.back-figures span,.form-figures span').forEach(scheduleFigureColour)}
document.addEventListener('visibilitychange',startFigureColours);figureMotion.addEventListener('change',startFigureColours);startFigureColours();

</script><script src="date-picker.js?v=2"></script><script src="guest-list.js?v=24"></script><script src="floating-logo.js?v=3"></script></html>
