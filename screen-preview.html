<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Lights · Screen previews</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f2f5;color:#615b69;font:13px system-ui}nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px}a{color:inherit;text-decoration:none;padding:8px 14px;border-radius:20px}a[aria-current=page]{background:#fff;color:#30283c}#size{font-size:11px}main{margin:0 auto 24px;position:relative}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;background:#faf6ff;box-shadow:0 8px 32px #30283c12}
</style>
<nav aria-label="Preview size"><a href="?view=ipad" id="ipad">iPad</a><a href="?view=desktop" id="desktop">Computer</a><span id="size"></span></nav>
<main><iframe title="Night Lights responsive preview" src="index.html?v=nightlights-card-glass-v19"></iframe></main>
<script>
const mode=new URLSearchParams(location.search).get('view')==='desktop'?'desktop':'ipad';
const [width,height]=mode==='desktop'?[1440,900]:[834,1194];
document.title=`Night Lights · ${mode==='desktop'?'Computer':'iPad'} preview`;
document.getElementById(mode).setAttribute('aria-current','page');
document.getElementById('size').textContent=`${width} × ${height}`;
const frame=document.querySelector('iframe'),stage=document.querySelector('main');
frame.style.width=width+'px';frame.style.height=height+'px';
function fit(){const scale=Math.min(1,(innerWidth-32)/width);stage.style.width=width*scale+'px';stage.style.height=height*scale+'px';frame.style.transform=`scale(${scale})`;}
addEventListener('resize',fit);fit();
</script>
</html>
